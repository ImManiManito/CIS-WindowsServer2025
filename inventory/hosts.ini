[windows_2025]
# Ejemplo:
# inntecprofact ansible_host=10.0.0.10 ansible_user=ansible-cis
# contpaq       ansible_host=10.0.0.11 ansible_user=ansible-cis

[windows_2025:vars]
# El nodo de control es Ubuntu/Linux y Windows se administra por OpenSSH.
ansible_connection=ssh
ansible_port=22
ansible_shell_type=powershell

# Recomendado: autenticacion por clave SSH.
# Puede definirse globalmente aqui o por host.
# ansible_user=ansible-cis
# ansible_ssh_private_key_file=~/.ssh/id_ed25519

# No se usa WinRM/PSRP en este proyecto.
# Las credenciales/llaves privadas no deben guardarse en el repositorio.

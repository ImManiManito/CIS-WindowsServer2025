---
- name: Apply CIS DWORD and string HKLM registry policies
  ansible.windows.win_regedit:
    path: "{{ item.path }}"
    name: "{{ item.name }}"
    data: "{{ item.value }}"
    type: "{{ item.type }}"
    state: present
  loop: "{{ cis_registry_settings | rejectattr('path', 'match', '^HKU:') | list }}"
  loop_control:
    label: "{{ item.id }} - {{ item.name }}"

- name: Get local Windows user profiles
  ansible.windows.win_shell: |
    Get-CimInstance Win32_UserProfile |
      Where-Object {
        $_.LocalPath -and
        $_.SID -and
        -not $_.Special
      } |
      Select-Object SID, LocalPath |
      ConvertTo-Json -Compress
  register: cis_user_profiles
  changed_when: false

- name: Parse Windows user profiles
  ansible.builtin.set_fact:
    cis_user_profiles_list: >-
      {{
        cis_user_profiles.stdout
        | from_json
        | list
      }}


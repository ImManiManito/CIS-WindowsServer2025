- name: Apply unambiguous CIS multi-string registry policies
  ansible.windows.win_regedit:
    path: "{{ item.path }}"
    name: "{{ item.name }}"
    data: "{{ item.value }}"
    type: multistring
    state: present
  loop: "{{ cis_registry_multistring_settings | selectattr('enabled', 'equalto', true) | list }}"
  loop_control:
    label: "{{ item.id }} - {{ item.name }}"
